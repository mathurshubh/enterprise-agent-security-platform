name: DevSecOps Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run Ruff Linter
        run: ruff check

      - name: Run Pytest Suite
        run: python -m pytest

  frontend-quality:
    name: Frontend Quality (ESLint & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite Build
        run: npm run build

  docs-quality:
    name: Documentation Quality (Markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Tooling Dependencies
        run: npm ci

      - name: Run Markdownlint
        run: npm run lint:md

  hygiene-quality:
    name: Repository Hygiene (Git Whitespace Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Git Diff Check
        run: git diff --check HEAD~1 HEAD || git diff --check

  security-quality:
    name: Secret & Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python for Dependency Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run Python Dependency Audit
        run: pip-audit -r requirements-lock.txt

      - name: Set up Node.js for Frontend Audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Audit (High/Critical)
        working-directory: frontend
        run: npm audit --audit-level=high
