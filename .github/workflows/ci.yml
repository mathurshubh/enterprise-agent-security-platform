name: DevSecOps Quality Pipeline

on:
  push:
    branches: [ main ]
    # Release tags run the hygiene job alone, to assert that the tag name matches the
    # VERSION declared by the tagged tree. Without this trigger the tag assertion in
    # hygiene-quality was unreachable.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality (Ruff & Pytest)
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-tools.txt

      - name: Verify requirements.txt Is Reproducible
        env:
          PYTHON: python
          PIP_TOOLS_VENV: ${{ runner.temp }}/pip-tools
        run: scripts/compile-requirements.sh --check

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check

      - name: Run Pytest Suite
        run: python -m pytest

  frontend-quality:
    name: Frontend Quality (ESLint & Vite Build)
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite Build
        run: npm run build

      - name: Run Dev Proxy Auth Tests
        run: npm run test:dev-proxy

  docs-quality:
    name: Documentation Quality (Markdownlint)
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Tooling Dependencies
        run: npm ci

      - name: Run Markdownlint
        run: npm run lint:md

  hygiene-quality:
    name: Repository Hygiene (Git Whitespace Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Git Diff Check
        run: git diff --check HEAD~1 HEAD || git diff --check

      - name: Validate Canonical Version Invariants
        run: |
          set -euo pipefail

          # VERSION is the machine-readable version authority. Two controls protect it:
          #
          #   prevention  (branch/PR runs) the frontend manifests must agree with VERSION,
          #               and if a release tag for that version already exists it must
          #               belong to this history.
          #   detection   (tag runs) the pushed tag name must match the VERSION declared by
          #               the tagged tree itself.
          #
          # A tag-triggered check cannot prevent a bad tag, only report one, which is why
          # prevention runs on the ordinary path rather than relying on the tag run.

          if [ ! -f VERSION ]; then
            echo "Error: Canonical VERSION file missing from repository root." >&2
            exit 1
          fi
          VERSION_VAL=$(tr -d '[:space:]' < VERSION)
          SEMVER_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! echo "$VERSION_VAL" | grep -Eq "$SEMVER_PATTERN"; then
            echo "Error: VERSION '$VERSION_VAL' does not follow semantic versioning." >&2
            exit 1
          fi
          EXPECTED_TAG="v${VERSION_VAL}"

          # Every version-bearing manifest must agree with VERSION. package.json alone is
          # not sufficient: the lockfile mirrors the version and can diverge on its own.
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION_VAL" ]; then
            echo "Error: frontend/package.json version '$PKG_VERSION' does not match root VERSION '$VERSION_VAL'." >&2
            exit 1
          fi
          LOCK_VERSION=$(node -p "require('./frontend/package-lock.json').version")
          if [ "$LOCK_VERSION" != "$VERSION_VAL" ]; then
            echo "Error: frontend/package-lock.json version '$LOCK_VERSION' does not match root VERSION '$VERSION_VAL'." >&2
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # The checkout is the tag ref, so VERSION above was read from the tagged tree.
            # That is the comparison that matters: the tag name must describe the version
            # declared by the exact commit it names, not whatever main happens to hold now.
            if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
              echo "Error: release tag '${{ github.ref_name }}' does not match '$EXPECTED_TAG', the version declared by the tagged tree." >&2
              exit 1
            fi
            echo "Release tag '${{ github.ref_name }}' matches the tagged tree's VERSION '$VERSION_VAL'."
          else
            # If this version was already released, its tag must belong to this history.
            # Coexistence is the normal steady state after a release and must stay green;
            # a tag for this version on unrelated history is the collision worth failing.
            if git rev-parse -q --verify "refs/tags/${EXPECTED_TAG}" >/dev/null; then
              if git merge-base --is-ancestor "$EXPECTED_TAG" HEAD; then
                echo "Tag '$EXPECTED_TAG' exists and belongs to this history."
              else
                echo "Error: tag '$EXPECTED_TAG' exists but does not belong to this history." >&2
                echo "VERSION '$VERSION_VAL' names a release published from a different line of development." >&2
                exit 1
              fi
            else
              echo "Version '$VERSION_VAL' is unreleased; no tag '$EXPECTED_TAG' exists yet."
            fi
          fi

          echo "Canonical VERSION '$VERSION_VAL' validated successfully."

  security-quality:
    name: Secret & Vulnerability Scanning
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python for Dependency Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run Python Dependency Audit
        run: pip-audit -r requirements.txt

      - name: Set up Node.js for Frontend Audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Audit (High/Critical)
        working-directory: frontend
        run: npm audit --audit-level=high
